# Yerel geliştirme: SQL Server 2022 Express (Docker)
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dershane-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dershane_Sql_2026!"
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - dershane_sql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Dershane_Sql_2026!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  dershane_sql_data:
